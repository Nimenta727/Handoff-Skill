name: Publish Agent Handoff Skill
on:
  push:
    branches: [main]
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: handoff-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify all tests
        run: python -m unittest discover -s tests -v
      - name: Validate old and current samples
        run: |
          python scripts/validate_handoff.py examples/sample-handoff --mode quick
          python scripts/validate_handoff.py examples/v1.2-handoff --mode quick
      - name: Build reproducible release
        run: |
          python scripts/build_release.py --out dist
          cd dist
          sha256sum -c *.sha256
      - name: Publish release with ZIP and SHA-256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG; refusing overwrite."
            exit 0
          fi
          gh release create "$TAG"             "dist/agent-handoff-v${VERSION}.zip"             "dist/agent-handoff-v${VERSION}.zip.sha256"             --target "$GITHUB_SHA"             --title "Agent Handoff Skill $TAG / 双语发行"             --notes-file RELEASE_NOTES.md             --latest
